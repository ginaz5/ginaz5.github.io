{{ if .Site.Params.languages.enable | default false }}
<section class="region" id="languages">
  <h2 class="region-label">{{ .Site.Params.languages.title | default "Languages" }}</h2>
  <div class="lang-grid">
    {{ range .Site.Params.languages.items }}
    <div class="lang">
      <div class="lang-name">{{ .name }}</div>
      {{ with .level }}<div class="lang-level">{{ . }}</div>{{ end }}
    </div>
    {{ end }}
  </div>
</section>
{{ end }}
